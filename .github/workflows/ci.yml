name: Verify Mystery Box
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify Compose and real MQTT traffic
        run: |
          python3 - <<'PYTHON'
          import secrets
          with open('/tmp/mystery-box-verification.env', 'w') as f:
              for name in ['ADMIN_PASSWORD', 'PARTNER_PASSWORD', 'MQTT_SERVER_PASSWORD', 'MQTT_DEVICE_PASSWORD']:
                  f.write(name + '=' + secrets.token_hex(24) + '\n')
              f.write('APP_ORIGIN=http://localhost:3307\nLOCAL_HTTP_PORT=3307\n')
          PYTHON
          docker compose --project-name mystery-box-ci --env-file /tmp/mystery-box-verification.env -f compose.yaml -f compose.local.yaml up --build --wait
          npm run test:integration
      - name: Clean up verification stack
        if: always()
        run: docker compose --project-name mystery-box-ci --env-file /tmp/mystery-box-verification.env -f compose.yaml -f compose.local.yaml down -v
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install 'PubSubClient@2.8' 'ArduinoJson@7.4.2' 'hd44780@1.3.2'
          cp firmware/mystery_box/arduino_secrets.h.example firmware/mystery_box/arduino_secrets.h
          arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi firmware/mystery_box
